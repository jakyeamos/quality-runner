name: Quality Runner repository hygiene

on:
  workflow_call:
    inputs:
      quality-runner-ref:
        description: Exact Quality Runner commit SHA to execute
        required: true
        type: string

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repository hygiene gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller repository
        uses: actions/checkout@v7.0.0

      - name: Check out pinned Quality Runner
        uses: actions/checkout@v7.0.0
        with:
          repository: jakyeamos/quality-runner
          ref: ${{ inputs.quality-runner-ref }}
          path: .quality-runner-source
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"

      - name: Run repo-hygiene-v1
        run: >-
          uv run --project "$GITHUB_WORKSPACE/.quality-runner-source"
          quality-runner repo-hygiene check "$GITHUB_WORKSPACE" --json
